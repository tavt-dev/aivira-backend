server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:26MB}

  datasource:
    url: ${DB_URL}
    username: ${USERNAME_DB}
    password: ${PASSWORD_DB}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

security:
  public-endpoints: ${PUBLIC_ENDPOINTS:/oauth2/**,/auth/token,/auth/register,/auth/verify-user,/auth/resend-verification,/auth/forgot-password,/auth/reset-password,/auth/refresh-token,/auth/logout,/auth/google/**,/categories,/categories/**,/products,/products/**,/storefront/**,/payments/vnpay/return,/payments/vnpay/ipn,/payments/momo/return,/payments/momo/ipn,/actuator/health,/swagger-ui.html,/swagger-ui/**,/v3/api-docs,/v3/api-docs/**,/v3/api-docs.yaml,/api/v1/auth/token,/api/v1/auth/register,/api/v1/auth/verify-user,/api/v1/auth/resend-verification,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/api/v1/auth/refresh-token,/api/v1/auth/logout,/api/v1/auth/google/**,/api/v1/categories,/api/v1/categories/**,/api/v1/products,/api/v1/products/**,/api/v1/storefront/**,/api/v1/payments/vnpay/return,/api/v1/payments/vnpay/ipn,/api/v1/payments/momo/return,/api/v1/payments/momo/ipn,/api/v1/actuator/health,/api/v1/swagger-ui.html,/api/v1/swagger-ui/**,/api/v1/v3/api-docs,/api/v1/v3/api-docs/**,/api/v1/v3/api-docs.yaml}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  issuer: ${JWT_ISSUER:aivira.com}
  valid-duration: ${JWT_VALID_DURATION:3600}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:36000}

auth:
  refresh-token:
    body-enabled: ${AUTH_REFRESH_TOKEN_BODY_ENABLED:true}
    cookie-name: ${AUTH_REFRESH_TOKEN_COOKIE_NAME:refreshToken}
    cookie-path: ${AUTH_REFRESH_TOKEN_COOKIE_PATH:/api/v1/auth}
    cookie-same-site: ${AUTH_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
    cookie-secure: ${AUTH_REFRESH_TOKEN_COOKIE_SECURE:true}
    cookie-http-only: ${AUTH_REFRESH_TOKEN_COOKIE_HTTP_ONLY:true}
  brute-force:
    max-attempts: ${AUTH_BRUTE_FORCE_MAX_ATTEMPTS:5}
    window-minutes: ${AUTH_BRUTE_FORCE_WINDOW_MINUTES:15}
    lock-minutes: ${AUTH_BRUTE_FORCE_LOCK_MINUTES:15}
  cleanup:
    cron: ${AUTH_CLEANUP_CRON:0 0 * * * *}
    otp-used-retention-hours: ${AUTH_CLEANUP_OTP_USED_RETENTION_HOURS:24}
    oauth-used-retention-hours: ${AUTH_CLEANUP_OAUTH_USED_RETENTION_HOURS:1}
  google:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    scopes: ${GOOGLE_OAUTH_SCOPES:openid email profile}
    frontend-success-url: ${GOOGLE_OAUTH_FRONTEND_SUCCESS_URL:http://localhost:5173/auth/google/success}
    frontend-failure-url: ${GOOGLE_OAUTH_FRONTEND_FAILURE_URL:http://localhost:5173/auth/google/failure}
    state-ttl-seconds: ${GOOGLE_OAUTH_STATE_TTL_SECONDS:300}
    ticket-ttl-seconds: ${GOOGLE_OAUTH_TICKET_TTL_SECONDS:300}
    authorization-uri: ${GOOGLE_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
    token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
    issuer-uri: ${GOOGLE_OAUTH_ISSUER_URI:https://accounts.google.com}

app:
  seed:
    enabled: ${SEED_ENABLED:false}
    demo-catalog-enabled: ${SEED_DEMO_CATALOG_ENABLED:false}
    admin:
      username: ${SEED_ADMIN_USERNAME:}
      password: ${SEED_ADMIN_PASSWORD:}
      email: ${SEED_ADMIN_EMAIL:}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Aivira Store}
  upload:
    enabled: ${APP_UPLOAD_ENABLED:true}
    max-image-size: ${APP_UPLOAD_MAX_IMAGE_SIZE:5242880}
    max-document-size: ${APP_UPLOAD_MAX_DOCUMENT_SIZE:10485760}
    allowed-image-types: ${APP_UPLOAD_ALLOWED_IMAGE_TYPES:image/jpeg,image/png,image/gif,image/webp}
    allowed-document-types: ${APP_UPLOAD_ALLOWED_DOCUMENT_TYPES:application/pdf}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  secure: ${CLOUDINARY_SECURE:true}
  avatar-folder: ${CLOUDINARY_AVATAR_FOLDER:aivira/users}
  product-media-folder: ${CLOUDINARY_PRODUCT_MEDIA_FOLDER:aivira/products}
  review-image-folder: ${CLOUDINARY_REVIEW_IMAGE_FOLDER:aivira/reviews}

brevo:
  api-key: ${BREVO_API_KEY:}
  base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  send-email-path: ${BREVO_SEND_EMAIL_PATH:/v3/smtp/email}
  connect-timeout-ms: ${BREVO_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${BREVO_READ_TIMEOUT_MS:10000}

payment:
  pending-ttl-minutes: ${PAYMENT_PENDING_TTL_MINUTES:15}
  frontend-result-url: ${PAYMENT_FRONTEND_RESULT_URL:http://localhost:5173/payment-result}
  expiry-scan-delay-ms: ${PAYMENT_EXPIRY_SCAN_DELAY_MS:60000}
  provider-connect-timeout-ms: ${PAYMENT_PROVIDER_CONNECT_TIMEOUT_MS:5000}
  provider-read-timeout-ms: ${PAYMENT_PROVIDER_READ_TIMEOUT_MS:30000}
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:}
    ipn-url: ${VNPAY_IPN_URL:}
    transaction-url: ${VNPAY_TRANSACTION_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  momo:
    enabled: ${MOMO_ENABLED:false}
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    redirect-url: ${MOMO_REDIRECT_URL:}
    ipn-url: ${MOMO_IPN_URL:}
    request-type: ${MOMO_REQUEST_TYPE:payWithMethod}
    query-endpoint: ${MOMO_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/query}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
