spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aivira?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

auth:
  refresh-token:
    cookie-secure: false
